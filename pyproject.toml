[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "retrivial augmented gen project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
    "fire",
    "tqdm",
    "langchain",
    "langchain-text-splitters>=1.1.2",
    "bm25s",
    "transformers>=4.30.2",
    "torch>=2.7.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
exclude = "(^data/|^datasets_public/|^moulinette_pkg/|^tester/|^\\.venv/)"
