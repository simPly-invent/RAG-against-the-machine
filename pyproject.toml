[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student"]

[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "retrivial augmented gen project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
    "fire"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
